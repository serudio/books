<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <!--
      Crawlers and older clients want a real .ico; modern browsers take the
      SVG. Relative paths, because the site lives under /books/.
    -->
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="./favicon-96.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Оренда книг у Львові на Сихові: 50 грн на тиждень, застава 300 грн повертається. Домашня бібліотека — художня література, психологія, виховання."
    />
    <!--
      Self-referencing canonical. GitHub Pages serves this app at
      /books/ and 301-redirects /books to it, so search engines know
      both forms; without this tag they have to guess which is the
      real one, and the slashless variant kept coming back as a
      "redirect error" in Search Console. Keep the trailing slash,
      and update the domain here if the site ever moves.
    -->
    <link rel="canonical" href="https://serudio.github.io/books/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Оренда книг у Львові — домашня бібліотека на Сихові. Львів</title>

    <!-- Link previews in Telegram/Viber, where the site is actually shared. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="uk_UA" />
    <meta property="og:url" content="https://serudio.github.io/books/" />
    <meta
      property="og:title"
      content="Оренда книг у Львові — домашня бібліотека на Сихові. Львів"
    />
    <meta
      property="og:description"
      content="50 грн на 2 тижні, застава 300 грн повертається. Львів, Сихів, біля Шувару."
    />
    <meta name="twitter:card" content="summary" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Library",
        "name": "Оренда книг Львів",
        "description": "Домашня бібліотека у Львові: книги в оренду за щотижневою ставкою з поверненням застави.",
        "url": "https://serudio.github.io/books/",
        "inLanguage": "uk",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Львів",
          "addressCountry": "UA"
        },
        "areaServed": "Львів"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Same GA4 property as the root site, so /books/ shows up next to it
      instead of being invisible. Two guards:
        * localhost is skipped, so development never touches the numbers;
        * opening /books/#noga once in a browser excludes that browser for
          good (/books/#ga undoes it) — that is how you keep yourself out
          of the counts, and it has to be done on each device you browse from.
    -->
    <script>
      (function () {
        var id = "G-4CPB5SN8DH";
        var excluded = false;

        try {
          if (location.hash === "#noga") localStorage.setItem("ga-off", "1");
          if (location.hash === "#ga") localStorage.removeItem("ga-off");
          excluded = localStorage.getItem("ga-off") === "1";
          console.info(
            excluded
              ? "Analytics off in this browser (#ga to undo)."
              : "Analytics on in this browser (#noga to opt out).",
          );
        } catch (error) {
          // Private mode or blocked storage: fall through and count the visit.
        }

        // Typing the hash on a page that is already open only fires
        // hashchange, so the block above would never see it.
        window.addEventListener("hashchange", function () {
          if (location.hash === "#noga" || location.hash === "#ga") {
            location.reload();
          }
        });

        if (location.hostname !== "serudio.github.io" || excluded) return;

        window.dataLayer = window.dataLayer || [];
        window.gtag = function () {
          window.dataLayer.push(arguments);
        };
        window.gtag("js", new Date());
        window.gtag("config", id);

        var tag = document.createElement("script");
        tag.async = true;
        tag.src = "https://www.googletagmanager.com/gtag/js?id=" + id;
        document.head.appendChild(tag);
      })();
    </script>
  </body>
</html>
