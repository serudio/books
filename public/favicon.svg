<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Фіолетовий фон -->
  <rect width="512" height="512" rx="64" fill="#31005b"/>
  
  <!-- Іконка книги -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Лівий блок сторінок (зовнішній контур) -->
    <path d="M 110,180 L 110,340 C 110,340 180,320 240,360 L 240,200 C 180,160 110,180 110,180 Z" stroke-width="16"/>
    <!-- Правий блок сторінок (зовнішній контур) -->
    <path d="M 402,180 L 402,340 C 402,340 332,320 272,360 L 272,200 C 332,160 402,180 402,180 Z" stroke-width="16"/>
    
    <!-- Внутрішні розгортки сторінок -->
    <path d="M 135,160 L 135,315 C 135,315 190,295 240,330 L 240,180 C 190,145 135,160 135,160 Z" stroke-width="14"/>
    <path d="M 377,160 L 377,315 C 377,315 322,295 272,330 L 272,180 C 322,145 377,160 377,160 Z" stroke-width="14"/>

    <!-- Центральні головні сторінки -->
    <path d="M 160,140 C 200,128 240,150 240,160 C 240,160 240,310 240,310 C 190,280 160,295 160,295" stroke-width="14"/>
    <path d="M 352,140 C 312,128 272,150 272,160 C 272,160 272,310 272,310 C 322,280 352,295 352,295" stroke-width="14"/>

    <!-- Корінець книги -->
    <path d="M 256,190 L 256,375" stroke-width="16"/>

    <!-- Літера S на лівій сторінці -->
    <path d="M 212,192 C 185,185 180,205 195,217 C 210,229 205,250 178,242" stroke-width="11"/>

    <!-- Рядки тексту на правій сторінці -->
    <line x1="300" y1="210" x2="340" y2="200" stroke-width="10"/>
    <line x1="298" y1="240" x2="345" y2="228" stroke-width="10"/>
    <line x1="296" y1="270" x2="340" y2="258" stroke-width="10"/>
  </g>
</svg>
